<section class="w-full py-2 bg-blue-900 text-white">
  <div class="container mx-auto flex justify-start px-6">
    <div class="flex w-full items-center">
      <h1 class="mr-3">Home</h1>
      <p>Rick & Morty App</p>
    </div>
    <div class="flex">
      <label class="text-black">
        <input type="search" placeholder="Find a character" [(ngModel)]="filterText" class="rounded px-4 py-2 mr-2" />
      </label>
      <input type="submit" value="Search" class="rounded bg-blue-500 text-white px-4 py-2 hover:bg-blue-600">
    </div>
  </div>
</section>

<div class="py-5 bg-gray-900 min-h-screen flex items-start justify-center">
  <div class="bg-gray-800 flex-1 flex flex-col space-y-5 lg:space-y-0 lg:flex-row lg:space-x-10 max-w-6xl sm:p-6 sm:my-2 sm:mx-4 sm:rounded-2xl">
    <div class="flex-1 px-2 sm:px-0">
      <div class="mb-10 sm:mb-0 grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
        <div *ngFor="let character of this.characterList?.results  | filterCharactersByNamePipeUseCase: filterText"
             class="relative group bg-gray-900 py-10 sm:py-20 px-4 flex flex-col space-y-2 items-center cursor-pointer rounded-md hover:bg-gray-900/80 hover:smooth-hover">
          <img class="w-32 h-32 object-cover object-center rounded-full" [src]="character.image" alt="cuisine"/>
          <h4 class="text-white text-2xl font-bold capitalize text-center">{{character.name}}</h4>
          <p class="text-white text-center">{{character.location.name}}</p>
          <p class="text-white text-center">{{character.species}}</p>
          <p class="inline-flex items-center justify-center text-white absolute top-2 text-lg">{{character.status}}
            <span class="ml-3 w-3 h-3 block rounded-full group-hover:animate-pulse"
                  [ngClass]="{'bg-green-600': character.status === 'Alive', 'bg-red-600': character.status === 'Dead', 'bg-purple-500': character.status === 'unknown' }">
            </span>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
